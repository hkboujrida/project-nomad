name: Build PKC Image

# Builds the admin image for the PKC (Kubernetes) deployment from the `pkc` branch.
# Published as ghcr.io/<owner>/project-nomad:pkc-<version>-<sha> and :pkc-latest.
# PKC pulls it through the Harbor ghcr proxy (harbor.priv.exitthecloud.eu/proxy-ghcr/...).

on:
  push:
    branches: [pkc]
    paths-ignore:
      - '**.md'
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: ./admin
      - run: node --import ts-node-maintained/register/esm --test tests/unit/service_endpoints.spec.ts
        working-directory: ./admin
      - run: npx tsc --noEmit
        working-directory: ./admin

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compute tags
        id: vars
        run: |
          version=$(node -p "require('./package.json').version")
          image=$(echo "ghcr.io/${{ github.repository_owner }}/project-nomad" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=pkc-${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:pkc-latest
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Summary
        run: echo "Pushed \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
